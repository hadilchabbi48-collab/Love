<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Heart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { background: radial-gradient(ellipse at center, #3d1033 0%, #1c0719 55%, #0a020a 100%); }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ready-made colors (10 levels of glow)
const colors = [];
for (let i = 0; i < 10; i++) {
    const g = i / 9;
    colors.push("hsla(" + (320 + g * 30) + ", 100%, " + (62 + g * 22) + "%, " + (0.3 + g * 0.5) + ")");
}

// big heart particles
const particles = [];
while (particles.length < 800) {
    const x = (Math.random() - 0.5) * 3;
    const y = (Math.random() - 0.5) * 3;
    if (Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0) {
        particles.push({
            x: x,
            y: y,
            size: Math.random() * 1.8 + 1.2,
            phase: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random()
        });
    }
}

// small heart sprites (drawn once)
function makeSprite(hue) {
    const c = document.createElement("canvas");
    c.width = 64;
    c.height = 64;
    const g = c.getContext("2d");
    g.fillStyle = "hsl(" + hue + ", 100%, 75%)";
    g.shadowBlur = 8;
    g.shadowColor = "hsl(" + hue + ", 100%, 70%)";
    const x = 32, y = 14, s = 36;
    g.beginPath();
    g.moveTo(x, y + s / 4);
    g.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s / 4);
    g.bezierCurveTo(x - s / 2, y + s / 2, x, y + s * 0.65, x, y + s * 0.85);
    g.bezierCurveTo(x, y + s * 0.65, x + s / 2, y + s / 2, x + s / 2, y + s / 4);
    g.bezierCurveTo(x + s / 2, y, x, y, x, y + s / 4);
    g.fill();
    return c;
}
const sprites = [322, 335, 348].map(makeSprite);

let hearts = [];

function spawnHeart(cx, cy, scale) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    hearts.push({
        x: cx + p.x * scale,
        y: cy - (p.y + 0.1) * scale,
        size: 10 + Math.random() * 18,
        vx: p.x * 0.5 + (Math.random() - 0.5) * 0.6,
        vy: 0.7 + Math.random() * 1.3,
        sway: Math.random() * Math.PI * 2,
        life: 1,
        sprite: sprites[Math.floor(Math.random() * sprites.length)]
    });
}

let frame = 0;

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "lighter";

    const scale = Math.min(canvas.width, canvas.height) / 3.4;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // heartbeat
    const t = (frame % 90) / 90;
    const beat = 1 + 0.1 * (
        Math.exp(-Math.pow((t - 0.10) * 14, 2)) +
        0.7 * Math.exp(-Math.pow((t - 0.30) * 14, 2))
    );

    // big heart
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const dx = Math.sin(frame * 0.03 * p.speed + p.phase) * 0.03;
        const dy = Math.cos(frame * 0.025 * p.speed + p.phase) * 0.03;
        const px = cx + (p.x + dx) * beat * scale;
        const py = cy - (p.y + dy + 0.1) * beat * scale;

        const glow = (Math.sin(frame * 0.06 * p.speed + p.phase) + 1) / 2;
        ctx.fillStyle = colors[Math.floor(glow * 9)];
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // spawn small hearts
    if (frame % 6 === 0 && hearts.length < 50) {
        spawnHeart(cx, cy, scale * beat);
    }

    // small hearts
    for (let i = 0; i < hearts.length; i++) {
        const h = hearts[i];
        h.x += h.vx + Math.sin(frame * 0.03 + h.sway) * 0.4;
        h.y -= h.vy;
        h.life -= 0.005;
        const d = h.size * 1.8;
        ctx.globalAlpha = Math.max(h.life, 0) * 0.9;
        ctx.drawImage(h.sprite, h.x - d / 2, h.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    hearts = hearts.filter(function (h) { return h.life > 0; });

    frame++;
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
